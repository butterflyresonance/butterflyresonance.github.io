# Étude server. Cloudflare reads this when it builds the Worker from GitHub.
name = "etude-tables"
main = "worker.js"
compatibility_date = "2025-09-01"

# the address the app connects to: etude-tables.<account>.workers.dev
workers_dev = true
preview_urls = false

# Admin accounts: they get Accounts on the Your account screen (every account on
# the server, and Delete). An account's id is its public key, so it is safe to keep
# here: it can't be used to sign in. The id is in the app's Copy report (Settings),
# on the 'account' line. Several are separated by commas.
[vars]
ADMIN_IDS = ""

[[durable_objects.bindings]]
name = "USERS"
class_name = "User"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "Game"

[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

# Durable Objects on the free plan must use the SQLite storage backend.
# Migrations are Cloudflare's record of every class this Worker has had, and are
# never edited: v1 made Table, v2 makes User, Game and Directory and deletes
# Table. A new class, or removing one, needs a new [[migrations]] entry (v3...).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["User", "Game", "Directory"]
deleted_classes = ["Table"]
