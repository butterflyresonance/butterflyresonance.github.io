<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table — a private chess board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #15181b;
    --panel: #1d2226;
    --edge: #2b3238;
    --sq-light: #ada497;   /* both squares sit mid-tone so near-white and */
    --sq-dark:  #535d61;   /* near-black pieces both read on either one   */
    --brass: #c8a35b;
    --brass-dim: #6d5a33;
    --text: #e8e6e1;
    --muted: #8b9198;
    --danger: #c05a4a;
    --display: "Bodoni Moda", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100dvh;
    padding: 0 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap { width: 100%; max-width: 460px; }

  /* ---- connection thread ---- */
  .thread {
    height: 2px;
    width: 100%;
    margin: 0 0 22px;
    background: var(--edge);
    position: relative;
    overflow: hidden;
  }
  .thread::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--brass);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .5s ease;
  }
  body[data-link="searching"] .thread::after {
    transform: scaleX(.35);
    animation: seek 1.9s ease-in-out infinite;
  }
  body[data-link="live"] .thread::after { transform: scaleX(1); }
  @keyframes seek {
    0%   { transform: translateX(-100%) scaleX(.35); }
    100% { transform: translateX(300%) scaleX(.35); }
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 22px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 30px;
    letter-spacing: .01em;
    margin: 0;
  }
  .link-state {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  body[data-link="live"] .link-state { color: var(--brass); }

  /* ---- lobby ---- */
  .lobby { margin-top: 34px; }
  .lede {
    font-family: var(--display);
    font-size: 19px;
    line-height: 1.5;
    margin: 0 0 26px;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 22px; }
  legend, .label {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 0 10px;
  }
  .choices { display: flex; gap: 8px; }
  .choices label { flex: 1; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices span {
    display: block;
    text-align: center;
    padding: 11px 6px;
    border: 1px solid var(--edge);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .choices input:checked + span { border-color: var(--brass); color: var(--brass); }
  .choices input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px; }

  button {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .04em;
    padding: 12px 16px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--edge);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--brass-dim); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button.primary { border-color: var(--brass); color: var(--brass); width: 100%; }
  button:disabled { opacity: .35; cursor: default; }

  /* ---- invite ---- */
  .invite { margin-top: 30px; }
  .code {
    font-family: var(--display);
    font-size: 34px;
    letter-spacing: .1em;
    color: var(--brass);
    margin: 6px 0 18px;
  }
  .invite-actions { display: flex; gap: 8px; }
  .invite-actions button { flex: 1; }
  .note {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    margin: 16px 0 0;
  }

  /* ---- game layout ---- */
  .status {
    font-family: var(--display);
    font-size: 22px;
    line-height: 1.3;
    margin: 24px 0 12px;
    min-height: 29px;
  }
  .status.urgent { color: var(--brass); }

  /* ---- captured strips ---- */
  .taken {
    display: flex;
    align-items: center;
    gap: 1px;
    height: 26px;
    margin: 6px 0;
  }
  .taken svg { width: 19px; height: 19px; display: block; opacity: .75; }
  .taken .adv {
    font-size: 12px;
    color: var(--brass);
    margin-left: 8px;
    letter-spacing: .02em;
  }

  /* ---- board ---- */
  .board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    outline: 1px solid var(--brass-dim);
    outline-offset: 3px;
    user-select: none;
    touch-action: manipulation;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .sq.light { background: var(--sq-light); }
  .sq.dark  { background: var(--sq-dark); }

  /* last move: a quiet wash, under the piece */
  .sq.last::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--brass);
    opacity: .22;
  }
  /* selection and check: rings, so the piece itself stays fully readable */
  .sq.sel::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid var(--brass);
  }
  .sq.check::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid var(--danger);
  }
  .sq.playable { cursor: pointer; }

  .sq svg.pc {
    position: relative;
    width: 92%;
    height: 92%;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
  }
  .sq svg.pc.moved { animation: settle .22s ease-out; }
  @keyframes settle {
    from { transform: scale(1.14); }
    to   { transform: scale(1); }
  }

  .sq .dot {
    position: absolute;
    width: 24%;
    height: 24%;
    border-radius: 50%;
    background: rgba(18,21,24,.42);
    pointer-events: none;
  }
  .sq.occupied .dot {
    width: 88%; height: 88%;
    background: transparent;
    border: 3px solid rgba(18,21,24,.42);
  }
  .coord {
    position: absolute;
    font-size: 9px;
    letter-spacing: .04em;
    opacity: .6;
    pointer-events: none;
  }
  .coord.f { right: 3px; bottom: 1px; }
  .coord.r { left: 3px; top: 1px; }
  .light .coord { color: #3d3830; }
  .dark  .coord { color: #d6dbdd; }

  /* ---- ledger ---- */
  .ledger { margin-top: 22px; }
  .ledger h2 {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 10px;
  }
  .moves {
    display: grid;
    grid-template-columns: 30px 1fr 1fr;
    gap: 2px 10px;
    font-size: 13px;
    max-height: 168px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .moves .n { color: var(--muted); }
  .moves .m { color: var(--text); }
  .moves .m.latest { color: var(--brass); }
  .empty-ledger { color: var(--muted); font-size: 13px; margin: 0; }

  .controls { display: flex; gap: 8px; margin-top: 22px; }
  .controls button { flex: 1; }

  .setrow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .setrow button { padding: 7px 12px; font-size: 11px; letter-spacing: .1em; }

  /* ---- desktop: board beside the rail ---- */
  @media (min-width: 820px) {
    .wrap { max-width: 900px; }
    .game-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 40px;
      align-items: start;
    }
    .status { margin-top: 0; font-size: 26px; }
    .rail { padding-top: 4px; }
    .ledger { margin-top: 26px; }
    .moves { max-height: 300px; }
  }

  /* ---- promotion ---- */
  .promo {
    position: fixed;
    inset: 0;
    background: rgba(10,12,14,.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .promo-box {
    background: var(--panel);
    border: 1px solid var(--edge);
    padding: 22px;
    text-align: center;
  }
  .promo-box p {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .promo-row { display: flex; gap: 6px; }
  .promo-row button { padding: 8px; }
  .promo-row svg { width: 46px; height: 46px; display: block; }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    body[data-link="searching"] .thread::after { animation: none; transform: scaleX(.35); }
    .sq svg.pc.moved { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body data-link="idle">
<div class="wrap">
  <div class="thread"></div>

  <header>
    <h1>Table</h1>
    <div class="link-state" id="linkState">no game</div>
  </header>

  <!-- LOBBY -->
  <section class="lobby" id="lobby">
    <p class="lede">A chess board for two people and nobody else. No accounts, no server — the two browsers talk straight to each other.</p>
    <fieldset>
      <legend>You play</legend>
      <div class="choices">
        <label><input type="radio" name="side" value="w" checked><span>White</span></label>
        <label><input type="radio" name="side" value="b"><span>Black</span></label>
        <label><input type="radio" name="side" value="r"><span>Toss</span></label>
      </div>
    </fieldset>
    <button class="primary" id="startBtn">Open a table</button>
  </section>

  <!-- INVITE -->
  <section class="invite hidden" id="invite">
    <div class="label">Table</div>
    <div class="code" id="codeText">— — —</div>
    <div class="invite-actions">
      <button id="waBtn">Send on WhatsApp</button>
      <button id="copyBtn">Copy link</button>
    </div>
    <p class="note">Send this once. After that the link is the table — either of you can reopen it any time.</p>
  </section>

  <!-- GAME -->
  <section class="game hidden" id="game">
    <div class="game-grid">
      <div class="boardcol">
        <div class="taken" id="takenTop"></div>
        <div class="board" id="board"></div>
        <div class="taken" id="takenBottom"></div>
      </div>
      <div class="rail">
        <div class="status" id="status">Setting up…</div>
        <div class="ledger">
          <h2>Moves</h2>
          <div id="ledgerBody"><p class="empty-ledger">Nothing played yet.</p></div>
        </div>
        <div class="controls">
          <button id="resignBtn">Resign</button>
          <button id="rematchBtn">Rematch</button>
        </div>
        <div class="setrow">
          <span>Pieces</span>
          <button id="setBtn">Bauhaus</button>
        </div>
        <p class="note" id="gameNote"></p>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { Chess } from 'https://esm.sh/chess.js@1.4.0';
import { joinRoom as joinNostr, getRelaySockets as nostrSockets } from 'https://esm.sh/@trystero-p2p/nostr@0.25.3';
import { joinRoom as joinMqtt, getRelaySockets as mqttSockets } from 'https://esm.sh/@trystero-p2p/mqtt@0.25.3';

const APP_ID = 'table-chess-v1';

// Trystero picks nostr relays by shuffling its defaults with a seed derived from
// APP_ID, so the app name silently decides which 5 you get — and some of the 47
// defaults are dead. Pin the big, well-maintained ones instead. All of these are
// from Trystero's own list, so they're known to accept the event kinds it needs.
const NOSTR_RELAYS = [
  'wss://relay.damus.io',
  'wss://nos.lol',
  'wss://relay.mostr.pub',
  'wss://purplerelay.com',
  'wss://strfry.openhoofd.nl',
  'wss://nostr.data.haus',
  'wss://relay.froth.zone',
  'wss://nostr-01.yakihonne.com'
];

const MQTT_BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://public:public@public.cloud.shiftr.io'
];

const el = id => document.getElementById(id);
const boardEl = el('board');

let game = new Chess();
let myColor = 'w';
let code = null;
let result = null;
let selected = null;
let lastMove = null;
let senders = [];
let peers = new Set();

/* ---------- tiny guarded storage ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let pieceSet = store.get('table:set') === 'classic' ? 'classic' : 'bauhaus';

/* ---------- pieces ----------
   Drawn as SVG rather than Unicode glyphs. Glyph text can only be outlined with
   -webkit-text-stroke, which paints half its width *inside* the letterform and
   chews through thin details, and the shapes vary by whatever symbol font the
   machine happens to have. Paths give one silhouette everywhere.

   The default set is after Josef Hartwig's 1924 Bauhaus set: each piece's form
   states how it moves. Square for the pawn's single step, crenellated block for
   the rook's ranks and files, an L for the knight, a diamond whose edges are the
   bishop's diagonals, a circle for the queen's freedom in every direction, and
   the king as diamond over square — every direction, but only one step.        */
const SHAPES = {
  p: '<rect x="36" y="54" width="28" height="30"/>',
  r: '<path d="M28,84 V44 H38 V54 H46 V44 H54 V54 H62 V44 H72 V84 Z"/>',
  n: '<path d="M32,84 V32 H54 V62 H72 V84 Z"/>',
  b: '<path d="M50,42 L70,63 L50,84 L30,63 Z"/>',
  q: '<circle cx="50" cy="62" r="22"/>',
  k: '<path d="M50,27 L67,44 L50,61 L33,44 Z"/><rect x="35" y="64" width="30" height="20"/>'
};

const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const SYMBOL_FONTS = "'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','DejaVu Sans',sans-serif";

function pieceSVG(type, color, cls = '') {
  const fill   = color === 'w' ? '#f2ede2' : '#22262b';
  const stroke = color === 'w' ? '#191c20' : '#e6e0d3';

  if (pieceSet === 'classic') {
    // paint-order="stroke" lays the outline down first, so the fill covers it
    // from the inside out and the glyph keeps its detail.
    return `<svg class="pc ${cls}" viewBox="0 0 100 100" aria-hidden="true"
      ><text x="50" y="56" text-anchor="middle" dominant-baseline="middle"
             font-size="82" font-family="${SYMBOL_FONTS}"
             fill="${fill}" stroke="${stroke}" stroke-width="3"
             paint-order="stroke">${GLYPH[type]}</text></svg>`;
  }

  // viewBox cropped to the shapes' own bounding box so the pieces sit with
  // presence in the square rather than floating in dead space.
  return `<svg class="pc ${cls}" viewBox="19 24 62 62" aria-hidden="true"
    ><g fill="${fill}" stroke="${stroke}" stroke-width="3.5"
        stroke-linejoin="round">${SHAPES[type]}</g></svg>`;
}

/* ---------- routing ---------- */
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { r: p.get('r'), c: p.get('c') };
}

function makeCode() {
  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(9));
  return [...bytes].map(b => alphabet[b % alphabet.length]).join('');
}

/* ---------- networking ---------- */
function connect() {
  const base = { appId: APP_ID, password: code };

  const strategies = [
    { join: joinNostr, urls: NOSTR_RELAYS },
    { join: joinMqtt,  urls: MQTT_BROKERS }
  ];

  for (const { join, urls } of strategies) {
    let room;
    try {
      room = join(
        {
          ...base,
          relayConfig: {
            urls,
            redundancy: urls.length,
            warnOnRelayFailure: false
          }
        },
        code,
        { onJoinError: err => console.warn('relay join failed', err) }
      );
    } catch (e) {
      console.warn('strategy unavailable', e);
      continue;
    }

    const action = room.makeAction('msg');
    action.onMessage = data => handleMessage(data);
    senders.push(data => action.send(data));

    room.onPeerJoin = id => { peers.add(id); setLink(); sendState(); };
    room.onPeerLeave = id => { peers.delete(id); setLink(); };
  }

  setLink();
  setInterval(() => { if (!peers.size) drawStatus(); }, 2500);
}

function relayHealth() {
  let open = 0, total = 0;
  for (const getSockets of [nostrSockets, mqttSockets]) {
    try {
      const sockets = getSockets() || {};
      for (const url of Object.keys(sockets)) {
        total++;
        if (sockets[url] && sockets[url].readyState === 1) open++;
      }
    } catch {}
  }
  return { open, total };
}

function broadcast(msg) {
  for (const send of senders) {
    try {
      Promise.resolve(send(msg)).catch(e => console.warn('send failed', e));
    } catch (e) {
      console.warn('send failed', e);
    }
  }
}

function sendState() {
  broadcast({ t: 'state', history: game.history(), result });
}

function handleMessage(msg) {
  if (!msg || typeof msg !== 'object') return;

  if (msg.t === 'state') {
    if (Array.isArray(msg.history)) adopt(msg.history, msg.result);
    return;
  }

  if (msg.t === 'move') {
    const ply = game.history().length;
    if (msg.ply === ply) {
      try {
        const m = game.move(msg.san);
        if (m) { lastMove = { from: m.from, to: m.to }; checkEnd(); persist(); draw(); }
      } catch { sendState(); }
    } else if (msg.ply > ply) {
      broadcast({ t: 'sync' });
    }
    return;
  }

  if (msg.t === 'sync') { sendState(); return; }

  if (msg.t === 'resign') {
    result = { type: 'resign', winner: msg.by === 'w' ? 'b' : 'w' };
    persist(); draw();
    return;
  }

  if (msg.t === 'rematch') { startFresh(msg.yourColor); return; }
}

function adopt(history, remoteResult) {
  if (history.length < game.history().length) { sendState(); return; }
  if (history.length === game.history().length && !remoteResult) return;

  const fresh = new Chess();
  for (const san of history) {
    try { fresh.move(san); } catch { return; }
  }
  game = fresh;
  const verbose = game.history({ verbose: true });
  lastMove = verbose.length ? { from: verbose.at(-1).from, to: verbose.at(-1).to } : null;
  result = remoteResult || null;
  checkEnd();
  persist();
  draw();
}

/* ---------- game flow ---------- */
function localMove(from, to, promotion) {
  let m;
  try { m = game.move({ from, to, promotion }); } catch { return false; }
  if (!m) return false;
  lastMove = { from: m.from, to: m.to };
  broadcast({ t: 'move', ply: game.history().length - 1, san: m.san });
  checkEnd();
  if (result) sendState();
  persist();
  draw();
  return true;
}

function checkEnd() {
  if (result) return;
  if (game.isCheckmate()) result = { type: 'checkmate', winner: game.turn() === 'w' ? 'b' : 'w' };
  else if (game.isStalemate()) result = { type: 'stalemate', winner: null };
  else if (game.isDraw()) result = { type: 'draw', winner: null };
}

function startFresh(colorForMe) {
  game = new Chess();
  myColor = colorForMe;
  result = null;
  selected = null;
  lastMove = null;
  persist();
  draw();
}

function persist() {
  if (!code) return;
  store.set('table:' + code, { history: game.history(), myColor, result });
}

function restore() {
  const saved = store.get('table:' + code);
  if (!saved || !Array.isArray(saved.history)) return;
  const fresh = new Chess();
  for (const san of saved.history) { try { fresh.move(san); } catch { return; } }
  game = fresh;
  result = saved.result || null;
  const verbose = game.history({ verbose: true });
  lastMove = verbose.length ? { from: verbose.at(-1).from, to: verbose.at(-1).to } : null;
}

/* ---------- rendering ---------- */
const FILES = 'abcdefgh';
const START_COUNT = { p: 8, n: 2, b: 2, r: 2, q: 1 };
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9 };

function draw() {
  drawBoard();
  drawStatus();
  drawTaken();
  drawLedger();
  el('resignBtn').disabled = !!result || game.history().length === 0;
  el('rematchBtn').classList.toggle('hidden', !result);
  el('setBtn').textContent = pieceSet === 'classic' ? 'Classic' : 'Bauhaus';
}

function drawBoard() {
  const myTurn = game.turn() === myColor && !result;
  const targets = selected
    ? game.moves({ square: selected, verbose: true }).reduce((acc, m) => (acc[m.to] = m, acc), {})
    : {};

  const ranks = myColor === 'w' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const files = myColor === 'w' ? [...FILES] : [...FILES].reverse();

  let html = '';

  for (const rank of ranks) {
    for (const file of files) {
      const sq = file + rank;
      const piece = game.get(sq);
      const isLight = (FILES.indexOf(file) + rank) % 2 === 1;

      const classes = ['sq', isLight ? 'light' : 'dark'];
      if (lastMove && (lastMove.from === sq || lastMove.to === sq)) classes.push('last');
      if (selected === sq) classes.push('sel');
      if (piece && piece.type === 'k' && piece.color === game.turn() && game.isCheck() && !result) {
        classes.push('check');
      }

      const isTarget = !!targets[sq];
      const canPick = myTurn && piece && piece.color === myColor;
      if (isTarget || canPick) classes.push('playable');
      if (isTarget && piece) classes.push('occupied');

      let inner = '';
      if (piece) {
        const moved = lastMove && lastMove.to === sq ? 'moved' : '';
        inner += pieceSVG(piece.type, piece.color, moved);
      }
      if (isTarget) inner += '<span class="dot"></span>';
      if (rank === (myColor === 'w' ? 1 : 8)) inner += `<span class="coord f">${file}</span>`;
      if (file === (myColor === 'w' ? 'a' : 'h')) inner += `<span class="coord r">${rank}</span>`;

      const tab = (isTarget || canPick) ? ' tabindex="0"' : '';
      html += `<div class="${classes.join(' ')}" data-sq="${sq}"${tab}>${inner}</div>`;
    }
  }

  boardEl.innerHTML = html;
}

/* which pieces of `color` have been taken off the board */
function takenPieces(color) {
  const onBoard = {};
  for (const row of game.board()) {
    for (const cell of row) {
      if (cell && cell.color === color) onBoard[cell.type] = (onBoard[cell.type] || 0) + 1;
    }
  }
  const out = [];
  for (const type of ['q','r','b','n','p']) {
    const gone = (START_COUNT[type] || 0) - (onBoard[type] || 0);
    for (let i = 0; i < gone; i++) out.push(type);
  }
  return out;
}

function material(list) {
  return list.reduce((sum, t) => sum + (VALUE[t] || 0), 0);
}

function drawTaken() {
  const them = myColor === 'w' ? 'b' : 'w';
  const iTook = takenPieces(them);      // their pieces, sitting on my side
  const theyTook = takenPieces(myColor);
  const edge = material(iTook) - material(theyTook);

  const strip = (list, colour, lead) =>
    list.map(t => pieceSVG(t, colour)).join('') +
    (lead > 0 ? `<span class="adv">+${lead}</span>` : '');

  el('takenTop').innerHTML = strip(theyTook, myColor, -edge);
  el('takenBottom').innerHTML = strip(iTook, them, edge);
}

function drawStatus() {
  const s = el('status');
  s.classList.remove('urgent');

  if (result) {
    if (result.type === 'resign') {
      s.textContent = result.winner === myColor ? 'They resigned. You win.' : 'You resigned.';
    } else if (result.type === 'checkmate') {
      s.textContent = result.winner === myColor ? 'Checkmate. You win.' : 'Checkmate. You lose.';
    } else {
      s.textContent = result.type === 'stalemate' ? 'Stalemate. Drawn.' : 'Drawn.';
    }
    el('gameNote').textContent = '';
    return;
  }

  const check = game.isCheck() ? ' You’re in check.' : '';
  if (game.turn() === myColor) {
    s.textContent = 'Your move.' + check;
    s.classList.add('urgent');
  } else {
    s.textContent = game.isCheck() ? 'They’re in check.' : 'Their move.';
  }

  if (peers.size) {
    el('gameNote').textContent = '';
  } else {
    const { open, total } = relayHealth();
    el('gameNote').textContent = total && !open
      ? 'No signalling relays reachable. A network or firewall may be blocking WebSocket traffic.'
      : `Waiting for the other side to open the link. ${open}/${total} relays up. Moves only travel while both pages are open.`;
  }
}

function drawLedger() {
  const hist = game.history();
  const body = el('ledgerBody');
  if (!hist.length) {
    body.innerHTML = '<p class="empty-ledger">Nothing played yet.</p>';
    return;
  }
  let html = '<div class="moves">';
  for (let i = 0; i < hist.length; i += 2) {
    html += `<span class="n">${i / 2 + 1}.</span>`;
    for (const j of [i, i + 1]) {
      const latest = j === hist.length - 1 ? ' latest' : '';
      html += `<span class="m${latest}">${hist[j] || ''}</span>`;
    }
  }
  html += '</div>';
  body.innerHTML = html;
  const grid = body.firstChild;
  grid.scrollTop = grid.scrollHeight;
}

function setLink() {
  const state = !code ? 'idle' : peers.size ? 'live' : 'searching';
  document.body.dataset.link = state;
  el('linkState').textContent =
    state === 'idle' ? 'no game' : state === 'live' ? 'connected' : 'waiting';
  el('invite').classList.toggle('hidden', !(code && !peers.size && game.history().length === 0));
  if (!el('game').classList.contains('hidden')) drawStatus();
}

/* ---------- interaction ---------- */
function pick(sq) {
  if (result) return;

  if (selected) {
    const moves = game.moves({ square: selected, verbose: true }).filter(m => m.to === sq);
    if (moves.length) {
      if (moves.some(m => m.promotion)) { askPromotion(selected, sq); return; }
      const from = selected;
      selected = null;
      localMove(from, sq);
      return;
    }
  }

  const piece = game.get(sq);
  selected = (piece && piece.color === myColor && game.turn() === myColor && sq !== selected) ? sq : null;
  drawBoard();
}

boardEl.addEventListener('click', e => {
  const cell = e.target.closest('.sq');
  if (cell) pick(cell.dataset.sq);
});

boardEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const cell = e.target.closest('.sq');
  if (!cell) return;
  e.preventDefault();
  pick(cell.dataset.sq);
});

function askPromotion(from, to) {
  const overlay = document.createElement('div');
  overlay.className = 'promo';
  overlay.innerHTML =
    '<div class="promo-box"><p>Promote to</p><div class="promo-row">' +
    ['q','r','b','n'].map(t => `<button data-t="${t}">${pieceSVG(t, myColor)}</button>`).join('') +
    '</div></div>';
  overlay.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    overlay.remove();
    selected = null;
    localMove(from, to, b.dataset.t);
  });
  document.body.appendChild(overlay);
  overlay.querySelector('button').focus();
}

/* ---------- buttons ---------- */
el('startBtn').onclick = () => {
  const choice = document.querySelector('input[name=side]:checked').value;
  const mine = choice === 'r'
    ? (crypto.getRandomValues(new Uint8Array(1))[0] % 2 ? 'w' : 'b')
    : choice;
  code = makeCode();
  myColor = mine;
  location.hash = `r=${code}&c=${mine === 'w' ? 'b' : 'w'}`;
  begin();
};

function inviteUrl() {
  return `${location.origin}${location.pathname}#r=${code}&c=${myColor === 'w' ? 'b' : 'w'}`;
}

el('waBtn').onclick = () => {
  const text = `Game of chess? Your board is here — you're ${myColor === 'w' ? 'black' : 'white'}: ${inviteUrl()}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
};

el('copyBtn').onclick = async () => {
  try {
    await navigator.clipboard.writeText(inviteUrl());
    el('copyBtn').textContent = 'Copied';
    setTimeout(() => el('copyBtn').textContent = 'Copy link', 1600);
  } catch {
    prompt('Copy this link:', inviteUrl());
  }
};

el('resignBtn').onclick = () => {
  if (!confirm('Resign this game?')) return;
  result = { type: 'resign', winner: myColor === 'w' ? 'b' : 'w' };
  broadcast({ t: 'resign', by: myColor });
  persist();
  draw();
};

el('rematchBtn').onclick = () => {
  const next = myColor === 'w' ? 'b' : 'w';
  broadcast({ t: 'rematch', yourColor: myColor });
  startFresh(next);
};

el('setBtn').onclick = () => {
  pieceSet = pieceSet === 'classic' ? 'bauhaus' : 'classic';
  store.set('table:set', pieceSet);
  draw();
};

/* ---------- boot ---------- */
function begin() {
  el('lobby').classList.add('hidden');
  el('game').classList.remove('hidden');
  restore();
  connect();
  draw();
  setLink();
  el('codeText').textContent = code.slice(0, 3) + ' ' + code.slice(3, 6) + ' ' + code.slice(6);
}

const { r, c } = parseHash();
if (r) {
  code = r;
  myColor = c === 'b' ? 'b' : 'w';
  begin();
} else {
  setLink();
}

window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
