<!DOCTYPE html>
<html lang="en">
<!--
  Étude has moved to https://etudechess.com (repo github.com/etudechess/etude).
  This page stays at butterflyresonance.github.io/chess for good, so old links,
  bookmarks and home-screen icons still lead there.

  Opened, it:
    1. collects this browser's Étude account and settings from localStorage
       (CARRY below) and sends them to the new site after the #, which never
       leaves the browser: https://etudechess.com/#move=<base64url JSON of
       { key: stored text }>. The new site saves them and clears the address
       (the first script in its <head>).
    2. turns off push notifications for this address, removes the old service
       worker and its saved copies, so the old app can't come back from cache.
    3. passes on a link's purpose: a friend link (#add=) goes along inside the
       move as etude:addLink, which the new site uses once signed in; a link to
       an account (#key=) goes across as it is.
  Online games under way on the old server (#r= links) don't come across, so
  those links just open the new site.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Étude has moved</title>
<link rel="canonical" href="https://etudechess.com/">
<style>
  :root { --bg: #15181b; --ink: #e8e2d6; --muted: #9a958c; --brass: #c9a45c; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2eee6; --ink: #1d1d1d; --muted: #6b665e; --brass: #8a6a2c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Georgia, 'Times New Roman', serif; padding: 0 16px; box-sizing: border-box; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-weight: 400; font-size: 2.2rem; margin: 0 0 .4em; }
  p { color: var(--muted); margin: 0 0 1.2em; }
  a { color: var(--brass); }
</style>
</head>
<body>
<main>
  <h1>Étude has moved</h1>
  <p>It’s now at <a id="go" href="https://etudechess.com/">etudechess.com</a>. Taking you there with your account and settings…</p>
</main>
<script>
(function () {
  var NEW = 'https://etudechess.com/';
  // what comes across: the account, and the look, sound, coach and puzzle choices
  var CARRY = ['etude:account', 'etude:terms', 'etude:gnames',
    'table:theme', 'table:set', 'table:board', 'table:sfx', 'table:sfxVol',
    'table:pz', 'table:opp', 'table:oppOnly', 'table:think',
    'table:tab', 'table:coach', 'table:review', 'table:revBadges', 'table:revBar', 'table:revExplain', 'table:revTheirs',
    'table:openPick', 'table:openForce', 'table:openShut'];

  // text to base64url, via UTF-8
  function b64u(text) {
    var bytes = new TextEncoder().encode(text), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  // the address to go to: the new site, with this browser's account and settings
  function target() {
    var hash = location.hash;
    if (/^#key=/.test(hash)) return NEW + hash;          // a link to an account: as it is
    var data = {};
    try {
      for (var i = 0; i < CARRY.length; i++) {
        var v = localStorage.getItem(CARRY[i]);
        if (v !== null) data[CARRY[i]] = v;
      }
    } catch (e) {}
    // a friend link: kept the way the app keeps one it hasn't used yet
    var p = new URLSearchParams(hash.slice(1)), m = /^([A-Za-z0-9_-]{43})\.([A-Za-z0-9_-]{80,90})$/.exec(p.get('add') || '');
    if (m) data['etude:addLink'] = JSON.stringify({ id: m[1], sig: m[2], n: (p.get('n') || '').slice(0, 30) });
    return Object.keys(data).length ? NEW + '#move=' + b64u(JSON.stringify(data)) : NEW;
  }

  // notifications off for this address; the old service worker and its copies gone
  function cleanUp() {
    var jobs = [];
    try {
      if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) {
          if (reg.scope.indexOf('/chess/') < 0) return null;
          var unsub = reg.pushManager ? reg.pushManager.getSubscription().then(function (s) { return s && s.unsubscribe(); }) : null;
          return Promise.resolve(unsub).catch(function () {}).then(function () { return reg.unregister(); });
        }));
      }));
      if (window.caches) jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('table-chess-') === 0; }).map(function (k) { return caches.delete(k); }));
      }));
    } catch (e) {}
    // never wait more than 2 seconds for it
    return Promise.race([Promise.all(jobs).catch(function () {}), new Promise(function (r) { setTimeout(r, 2000); })]);
  }

  var url = NEW;
  try { url = target(); } catch (e) {}
  document.getElementById('go').href = url;
  cleanUp().then(function () { location.replace(url); });
})();
</script>
</body>
</html>
