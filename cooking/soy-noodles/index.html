<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soy Noodles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same kitchen column as the duck ramen page: quantity control, ingredients, steps with timers, notes; running timers pinned to the bottom */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #1b2129;
  --muted: #5b6573;
  --line: #d8dde4;
  --accent: #2c4a7c;
  --accent-soft: #e3e9f3;
  --on-accent: #ffffff;
  --alarm: #b3261e;
  --done: #8a929d;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1a2028; --ink: #e6eaf0; --muted: #9aa4b2;
    --line: #2c3440; --accent: #8fb0e8; --accent-soft: #1f2b3d; --on-accent: #0f1620;
    --alarm: #ff8a80; --done: #6b7583;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1a2028; --ink: #e6eaf0; --muted: #9aa4b2;
  --line: #2c3440; --accent: #8fb0e8; --accent-soft: #1f2b3d; --on-accent: #0f1620;
  --alarm: #ff8a80; --done: #6b7583;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-top: env(safe-area-inset-top, 0px); }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 18px; padding-block: 28px 120px; display: flex; flex-direction: column; gap: 32px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 2.1rem; font-weight: 800; line-height: 1.15; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 800; }
.sub { color: var(--muted); margin: 6px 0 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.back { display: inline-block; color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500; margin-bottom: 14px; }
.back:hover { text-decoration: underline; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tabs { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.tabs button { appearance: none; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--ink); font-family: var(--body); font-size: 0.92rem; font-weight: 500; padding: 12px 8px; cursor: pointer; line-height: 1.25; min-height: 52px; }
.tabs button:first-child { border-left: 0; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.tabs small { display: block; font-size: 0.75rem; font-weight: 400; opacity: 0.8; }
.control { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { appearance: none; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 1.4rem; width: 48px; height: 48px; cursor: pointer; font-family: var(--body); }
.stepper input { width: 64px; height: 48px; border: 0; text-align: center; font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--surface); color: var(--ink); font-family: var(--body); -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.control-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px; }
.control-text strong { font-size: 1.05rem; }
.control-text span { color: var(--muted); font-size: 0.9rem; }

section { display: flex; flex-direction: column; gap: 14px; }
.ing { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ing li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ing .amt { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.ing .name { min-width: 0; }
.ing .opt { color: var(--muted); font-weight: 400; }
.ing .note { display: block; color: var(--muted); font-size: 0.88rem; }
.groups { display: flex; flex-direction: column; gap: 18px; }

.stepgroups { display: flex; flex-direction: column; gap: 22px; }
.stepgroup { display: flex; flex-direction: column; gap: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; scroll-margin-top: 16px; scroll-margin-bottom: 110px; }
.steps input[type="checkbox"] { width: 22px; height: 22px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.steps .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.steps .head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.steps .head strong { font-size: 1.02rem; }
.steps .time { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps p { margin: 0; }
.steps li.done .body p, .steps li.done .head { color: var(--done); }
.steps li.done .head strong { text-decoration: line-through; }
.b { font-weight: 600; color: var(--accent); }
.steps li.done .b { color: var(--done); }

.timers { display: flex; flex-wrap: wrap; gap: 8px; }
.timer { display: flex; align-items: stretch; border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; }
.timer .go { appearance: none; border: 0; background: var(--accent-soft); color: var(--accent); font-family: var(--body); font-size: 0.95rem; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; }
.timer .go .clock { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.timer .go .what { font-size: 0.85rem; }
.timer .reset { appearance: none; border: 0; border-left: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-family: var(--body); font-size: 0.8rem; padding: 0 10px; cursor: pointer; }
.timer.running .go { background: var(--accent); color: var(--on-accent); }
.timer.ringing { border-color: var(--alarm); cursor: pointer; }
.timer.ringing .go { background: var(--alarm); color: var(--surface); padding-inline: 16px; animation: pulse 1s ease-in-out infinite; }
.timer.ringing .reset { display: none; }
@keyframes pulse { 50% { opacity: 0.65; } }

.tips { margin: 0; padding-left: 1.1rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px rgba(0,0,0,0.08); }
.dock-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; }
.chip { appearance: none; flex: 0 0 auto; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 6px 12px; font-family: var(--body); font-size: 0.88rem; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.chip .clock { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.paused { opacity: 0.7; }
.chip.ringing { background: var(--alarm); border-color: var(--alarm); color: var(--surface); animation: pulse 1s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) { .timer.ringing .go, .chip.ringing { animation: none; } }
@media (max-width: 420px) {
  h1 { font-size: 1.8rem; }
  .ing li { grid-template-columns: 6.2rem 1fr; }
}
</style>
<!-- installable as its own app: manifest.json and sw.js live in /cooking/, so it is separate from Étude and attune -->

<link rel="apple-touch-icon" href="/cooking/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>

<div class="wrap">
  <header>
    <a class="back" href="../">← Cooking</a>
    <div class="label" id="kicker"></div>
    <h1>Soy Noodles with Mince</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="tabs" role="tablist" aria-label="Version">
    <button type="button" role="tab" data-mode="kids">Kids' version<small>simpler, milder</small></button>
    <button type="button" role="tab" data-mode="full">Full version<small>the original</small></button>
  </div>

  <div class="control">
    <div class="control-text">
      <strong>Number of people</strong>
      <span>Every amount below updates.</span>
    </div>
    <div class="stepper">
      <button type="button" id="minus" aria-label="One fewer">−</button>
      <input id="qty" type="number" min="1" max="40" value="4" inputmode="numeric" aria-label="Number of people">
      <button type="button" id="plus" aria-label="One more">+</button>
    </div>
  </div>

  <section>
    <h2>Ingredients</h2>
    <div class="groups" id="groups"></div>
  </section>

  <section>
    <h2>Method</h2>
    <p class="sub" style="margin:0">Tap a timer to start it, tap again to pause. Running timers stay pinned to the bottom of the screen.</p>
    <div class="stepgroups" id="steps"></div>
  </section>

  <section>
    <h2>Notes</h2>
    <ul class="tips" id="tips"></ul>
  </section>
</div>

<div class="dock" id="dock" hidden><div class="dock-inner" id="dockInner"></div></div>

<script>
(function () {
  const qtyEl = document.getElementById('qty');
  const checked = {};

  // ---------- Timers ----------
  const timers = {
    marinate: { label: 'Marinate', what: 'Marinate', secs: 15 * 60 },
    noodle:   { label: 'Noodles', what: 'Boil', secs: 3 * 60 },
    brown:    { label: 'Mince', what: 'Brown, no stirring', secs: 2 * 60 },
    cook:     { label: 'Mince', what: 'Stir-fry through', secs: 3 * 60 },
    aroma:    { label: 'Garlic and ginger', what: 'Stir-fry', secs: 60 },
    veg:      { label: 'Vegetables', what: 'Stir-fry', secs: 60 },
    sauce:    { label: 'Sauce', what: 'Toss', secs: 60 }
  };
  for (const k in timers) Object.assign(timers[k], { remaining: timers[k].secs, endAt: 0, running: false, ringing: false, started: false });

  let audio = null;
  function ensureAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  function beep() {
    if (!audio) return;
    try {
      const t0 = audio.currentTime;
      for (let i = 0; i < 3; i++) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, t0 + i * 0.35);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + i * 0.35 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.35 + 0.25);
        o.connect(g).connect(audio.destination);
        o.start(t0 + i * 0.35); o.stop(t0 + i * 0.35 + 0.3);
      }
    } catch (e) {}
  }
  function buzz() { try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {} }

  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    const m = Math.floor(s / 60), r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }
  function left(t) { return t.running ? (t.endAt - Date.now()) / 1000 : t.remaining; }

  function toggleTimer(id) {
    ensureAudio();
    const t = timers[id];
    if (t.ringing) { resetTimer(id); return; }
    if (t.running) { t.remaining = left(t); t.running = false; }
    else { t.endAt = Date.now() + t.remaining * 1000; t.running = true; t.started = true; keepAwake(); }
    paint();
  }
  function resetTimer(id) {
    const t = timers[id];
    Object.assign(t, { remaining: t.secs, running: false, ringing: false, started: false });
    paint();
  }

  let lastRing = 0;
  function tick() {
    const now = Date.now();
    let anyRinging = false;
    for (const k in timers) {
      const t = timers[k];
      if (t.running && t.endAt <= now) { t.running = false; t.remaining = 0; t.ringing = true; lastRing = 0; }
      if (t.ringing) anyRinging = true;
    }
    if (anyRinging && now - lastRing > 4000) { lastRing = now; beep(); buzz(); }
    paint();
  }

  function paint() {
    document.querySelectorAll('.timer').forEach(el => {
      const t = timers[el.dataset.timer];
      el.classList.toggle('running', t.running);
      el.classList.toggle('ringing', t.ringing);
      el.querySelector('.clock').textContent = t.ringing ? 'Done' : fmt(left(t));
      el.querySelector('.what').textContent = t.ringing ? 'tap to stop' : t.what;
      el.querySelector('.go').setAttribute('aria-label',
        t.label + ': ' + (t.ringing ? 'done, tap to stop' : t.running ? 'running, tap to pause' : 'tap to start'));
    });
    const active = Object.entries(timers).filter(([, t]) => t.started || t.ringing);
    document.getElementById('dock').hidden = active.length === 0;
    document.getElementById('dockInner').innerHTML = active.map(([k, t]) =>
      '<button type="button" class="chip' + (t.ringing ? ' ringing' : t.running ? '' : ' paused') + '" data-chip="' + k + '">' +
      '<span>' + t.label + '</span><span class="clock">' + (t.ringing ? 'Done · tap to stop' : fmt(left(t)) + (t.running ? '' : ' ⏸')) + '</span></button>').join('');
  }

  document.getElementById('dockInner').addEventListener('click', e => {
    const chip = e.target.closest('[data-chip]');
    if (!chip) return;
    const k = chip.dataset.chip, t = timers[k];
    if (t.ringing) { resetTimer(k); return; }
    const el = document.querySelector('.timer[data-timer="' + k + '"]');
    if (el) el.closest('li').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // ---------- Amounts ----------
  function frac(x) {
    const q = Math.round(x * 4) / 4;
    if (q <= 0) return '¼';
    const w = Math.floor(q), rem = q - w;
    const f = rem === 0.25 ? '¼' : rem === 0.5 ? '½' : rem === 0.75 ? '¾' : '';
    if (w === 0) return f;
    return w + (f ? ' ' + f : '');
  }
  function spoons(tsp) { return tsp >= 3 ? frac(tsp / 3) + ' tbsp' : frac(tsp) + ' tsp'; }
  function cups(x) { return frac(x / 250); }
  const b = s => '<span class="b">' + s + '</span>';

  const whole = x => Math.max(1, Math.round(x));
  const halfUp = x => frac(Math.max(0.5, Math.round(x * 2) / 2));
  const wt = g => g >= 1000 ? String(+(g / 1000).toFixed(2)) + ' kg' : g + ' g';
  const s = (x, one, many) => (x > 1 ? many : one);
  // 4 people = 400 g mince. Noodles 100 g fresh per person (the original uses 250 g for 4; this is more filling).
  function recipe(n, mode) {
    const k = n / 4;
    const kids = mode !== 'full';
    const mince = Math.round(400 * k / 50) * 50;
    const noodles = Math.round(100 * n / 50) * 50;
    const stock = Math.round(190 * k / 10) * 10;
    const garlic = whole((kids ? 3 : 5) * k);
    const A = {
      mince: wt(mince) + ' mince',
      noodles: wt(noodles) + ' fresh noodles',
      mSoy: spoons((kids ? 3 : 6) * k) + ' soy sauce',
      mCorn: spoons((kids ? 1 : 3) * k) + ' cornflour',
      pepper: spoons((kids ? 0.5 : 2) * k) + ' white pepper',
      wine: spoons(6 * k) + ' Chinese cooking wine',
      garlic: garlic + ' garlic clove' + s(garlic, '', 's'),
      ginger: (kids ? frac(k) : frac(1.5 * k)) + ' cm piece of ginger',
      carrot: halfUp(0.5 * k) + ' carrot',
      onion: halfUp(k) + ' small brown onion',
      spring: whole(2 * k) + ' spring onion' + s(whole(2 * k), '', 's'),
      shiitake: whole(4 * k) + ' shiitake mushroom' + s(whole(4 * k), '', 's'),
      choy: whole(k) + ' handful' + s(whole(k), '', 's') + ' choy sum',
      sesame: spoons(4.5 * k) + ' sesame oil',
      slurry: spoons(3 * k) + ' cornflour and ' + spoons(3 * k) + ' water'
    };
    const sauceRows = [
      [stock + ' ml', 'chicken stock', false, ''],
      [spoons(6 * k), 'brown sugar', false, ''],
      [spoons(6 * k), 'dark soy sauce', false, ''],
      [spoons((kids ? 9 : 15) * k), 'regular soy sauce', false, kids ? 'the original uses 5 tbsp per 4 people; this is less salty' : ''],
      [spoons(3 * k), 'rice vinegar', false, '']
    ];
    if (kids) sauceRows.push([spoons(0.5 * k), 'white pepper', false, 'the original uses 2 tsp, which is hot for kids']);
    const marinade = kids ? [
      [spoons(3 * k), 'soy sauce', false, ''],
      [spoons(k), 'cornflour', false, ''],
      ['', 'bicarbonate of soda', false, 'a pinch. Keeps the meat tender.']
    ] : [
      [spoons(6 * k), 'soy sauce', false, ''],
      [spoons(6 * k), 'Chinese cooking wine', false, 'contains alcohol. Use the same amount of chicken stock to leave it out.'],
      [spoons(2 * k), 'white pepper', false, ''],
      [spoons(3 * k), 'cornflour', false, ''],
      ['', 'bicarbonate of soda', false, 'a pinch']
    ];
    const main = [
      [wt(mince), kids ? 'beef, pork or chicken mince' : 'beef mince', false, kids ? 'pork or chicken for anyone who does not like beef; cook it the same way' : 'or thinly sliced flank or rump steak'],
      [wt(noodles), 'fresh la mian noodles', false, 'or fresh ramen or hokkien noodles, or ' + Math.round(75 * n / 25) * 25 + ' g dried egg noodles'],
      [garlic, 'garlic clove' + s(garlic, '', 's'), false, 'chopped'],
      [kids ? frac(k) + ' cm' : frac(1.5 * k) + ' cm', 'piece of ginger', false, 'finely grated']
    ];
    if (kids) main.push(
      [halfUp(0.5 * k), 'carrot', false, 'cut into thin matchsticks or grated. Or a handful of frozen peas.'],
      [whole(2 * k), 'spring onion' + s(whole(2 * k), '', 's'), true, 'sliced, for the adults']
    );
    else main.push(
      [halfUp(k), 'small brown onion', false, 'thinly sliced'],
      [whole(2 * k), 'spring onions', false, 'whites and greens sliced separately'],
      [whole(4 * k), 'shiitake mushrooms', false, 'sliced'],
      [halfUp(0.5 * k), 'carrot', false, 'about 40 g per 4 people, cut into thin matchsticks'],
      [halfUp(0.5 * k), 'red capsicum', true, 'sliced. The original method uses it but leaves it out of the ingredient list.'],
      [whole(k), 'handful' + s(whole(k), '', 's') + ' choy sum', false, 'roughly chopped']
    );
    main.push([spoons(Math.max(3, 3 * k)), 'peanut or neutral oil', false, 'for cooking']);
    const groups = [
      { label: 'Meat and noodles', rows: main },
      { label: 'Coating for the mince', rows: marinade },
      { label: 'Sauce', rows: sauceRows },
      { label: 'To finish', rows: [
        [spoons(3 * k), 'cornflour', false, 'mixed with the same amount of water'],
        [spoons(4.5 * k), 'toasted sesame oil', false, '']
      ]}
    ];

    const kidSteps = [
      ['Get everything ready', '',
        'Cook ' + b(A.noodles) + ' as the packet says (the timer is set to 3 minutes; adjust it to match), drain, and toss with a few drops of oil so they do not stick. In a jug, mix the stock, brown sugar, dark soy, regular soy, rice vinegar and white pepper. In a cup, mix ' + b(A.slurry) + '. Chop ' + b(A.garlic) + ', grate ' + b(A.ginger) + ', and cut ' + b(A.carrot) + ' into matchsticks.', ['noodle']],
      ['Coat the mince', '',
        'In a bowl, mix ' + b(A.mince) + ' with ' + b(A.mSoy) + ', ' + b(A.mCorn) + ' and a pinch of bicarbonate of soda. No need to wait; cook it straight away.', []],
      ['Brown the mince', '2 + 3 min',
        'Heat a wok or large frying pan on high until very hot. Add a little oil and spread the mince out flat. Leave it for 2 minutes to brown, then break it up and stir-fry until cooked through with no pink, about 3 minutes. Take it out onto a plate.', ['brown', 'cook']],
      ['Fry the garlic, ginger and carrot', '1 min',
        'Add a little more oil. Stir-fry the garlic, ginger and carrot for 1 minute.', ['aroma']],
      ['Add the noodles and sauce', '1 min',
        'Add the noodles and toss for 30 seconds. Pour in the sauce and toss for 1 minute.', ['sauce']],
      ['Thicken', '',
        'Stir the cornflour mix and pour it in. Toss until the sauce turns glossy and clings to the noodles.', []],
      ['Return the mince and finish', '',
        'If anyone wants noodles without mince, lift their portion out now. Put the mince back in and toss for 30 seconds until it is coated in the sauce. Turn the heat off and stir through ' + b(A.sesame) + '.', []],
      ['Serve', '',
        'Serve in bowls, with spring onions on top for the adults.', []]
    ];
    const fullSteps = [
      ['Marinate the mince', '15 min',
        'Mix ' + b(A.mince) + ' with ' + b(A.pepper) + ', ' + b(A.wine) + ', ' + b(A.mSoy) + ', a pinch of bicarbonate of soda and ' + b(A.mCorn) + '. Leave it for 15 minutes.', ['marinate']],
      ['Get everything ready', '',
        'While it marinates: cook ' + b(A.noodles) + ' as the packet says (the timer is set to 3 minutes; adjust it to match), drain and set aside. Mix the stock, brown sugar, dark soy, regular soy and rice vinegar in a jug. Mix ' + b(A.slurry) + ' in a cup. Slice ' + b(A.onion) + ', ' + b(A.spring) + ' (whites and greens separately), ' + b(A.shiitake) + ', the carrot and the capsicum if using. Chop ' + b(A.garlic) + ', grate ' + b(A.ginger) + ', chop ' + b(A.choy) + '.', ['noodle']],
      ['Brown the mince', '2 min',
        'Heat a wok on high until very hot. Add a little oil and spread the mince out flat. Leave it for 2 minutes to brown, then stir-fry until mostly cooked (it finishes later). Take it out.', ['brown']],
      ['Fry the aromatics', '1 min',
        'Add a little more oil. Stir-fry the brown onion and spring onion whites briefly, then add the garlic and ginger for 1 minute.', ['aroma']],
      ['Fry the vegetables', '1 min',
        'Add the shiitake, carrot and capsicum. Stir-fry for 1 minute so they stay a little crisp. Take everything out and add it to the mince.', ['veg']],
      ['Fry the noodles', '30 sec',
        'Add a splash more oil and the noodles. Toss on high for 30 seconds.', []],
      ['Combine and sauce', '1 min',
        'Put the mince and vegetables back in. Pour in the sauce and toss on high for 1 minute.', ['sauce']],
      ['Thicken and finish', '',
        'Add the choy sum, the spring onion greens and the cornflour mix. Toss until glossy and slightly thickened. Turn the heat off and stir through ' + b(A.sesame) + '. Serve straight away with extra spring onion greens.', []]
    ];
    return {
      kicker: kids ? 'Kids\' version' : 'Full version',
      sub: kids
        ? 'Simplified from the ABC recipe: no marinating, milder and less salty, fewer vegetables. About 25 minutes.'
        : 'The original ABC recipe. About 45 minutes including the marinade and chopping.',
      groups: groups,
      steps: [{ items: kids ? kidSteps : fullSteps }],
      tips: kids ? [
        'If you do not have a wok, use your biggest frying pan and get it very hot. For more than 4 people, brown the mince in two batches.',
        'The noodles are best straight away. Leftovers reheat in the microwave with a splash of water.'
      ] : [
        'If you do not have a wok, use your biggest frying pan, get it very hot, and cook the mince and noodles in batches so they brown instead of steaming.',
        'Swap the vegetables for whatever you have: broccoli, cabbage, snow peas or other Asian greens.'
      ]
    };
  }

  // ---------- Render ----------
  function currentQty() {
    let v = parseInt(qtyEl.value, 10);
    if (!Number.isFinite(v) || v < 1) v = 1;
    if (v > 40) v = 40;
    return v;
  }

  let mode = 'kids';
  try { mode = localStorage.getItem('noodle-mode') === 'full' ? 'full' : 'kids'; } catch (e) {}
  document.querySelector('.tabs').addEventListener('click', e => {
    const t = e.target.closest('[data-mode]');
    if (!t) return;
    mode = t.dataset.mode;
    try { localStorage.setItem('noodle-mode', mode); } catch (e) {}
    render();
  });
  function render() {
    const d = recipe(currentQty(), mode);
    document.querySelectorAll('.tabs [role="tab"]').forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === mode)));
    document.getElementById('kicker').textContent = d.kicker;
    document.getElementById('sub').textContent = d.sub;
    document.getElementById('groups').innerHTML = d.groups.map(g =>
      '<div><div class="label">' + g.label + '</div><ul class="ing">' + g.rows.map(r =>
        '<li><span class="amt">' + r[0] + '</span><span class="name">' + r[1] +
        (r[2] ? ' <span class="opt">(optional)</span>' : '') +
        (r[3] ? '<span class="note">' + r[3] + '</span>' : '') + '</span></li>').join('') + '</ul></div>').join('');

    document.getElementById('steps').innerHTML = d.steps.map((g, gi) =>
      '<div class="stepgroup"><ol class="steps">' + g.items.map((s, i) => {
        const key = mode + '-' + gi + '-' + i;
        const on = !!checked[key];
        return '<li' + (on ? ' class="done"' : '') + '><input type="checkbox" data-key="' + key + '" aria-label="Mark step done: ' + s[0] + '"' + (on ? ' checked' : '') + '>' +
          '<div class="body"><div class="head"><strong>' + (i + 1) + '. ' + s[0] + '</strong>' +
          (s[1] ? '<span class="time">' + s[1] + '</span>' : '') + '</div><p>' + s[2] + '</p>' +
          (s[3].length ? '<div class="timers">' + s[3].map(id =>
            '<div class="timer" data-timer="' + id + '"><button type="button" class="go"><span class="clock"></span><span class="what"></span></button>' +
            '<button type="button" class="reset" aria-label="Reset ' + timers[id].label + ' timer">Reset</button></div>').join('') + '</div>' : '') +
          '</div></li>';
      }).join('') + '</ol></div>').join('');

    const tips = d.tips.slice();
    tips.push('Timers keep counting if you switch apps, but the alarm only sounds while this page is open. Your phone must not be on silent to hear it.');
    document.getElementById('tips').innerHTML = tips.map(t => '<li>' + t + '</li>').join('');
    paint();
  }

  document.getElementById('steps').addEventListener('click', e => {
    const tEl = e.target.closest('.timer');
    if (!tEl) return;
    if (timers[tEl.dataset.timer].ringing || e.target.closest('.reset')) resetTimer(tEl.dataset.timer);
    else if (e.target.closest('.go')) toggleTimer(tEl.dataset.timer);
  });
  document.getElementById('steps').addEventListener('change', e => {
    if (e.target.matches('input[type="checkbox"]')) {
      checked[e.target.dataset.key] = e.target.checked;
      e.target.closest('li').classList.toggle('done', e.target.checked);
    }
  });
  document.getElementById('minus').addEventListener('click', () => { qtyEl.value = Math.max(1, currentQty() - 1); render(); });
  document.getElementById('plus').addEventListener('click', () => { qtyEl.value = Math.min(40, currentQty() + 1); render(); });
  qtyEl.addEventListener('input', render);

  function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); tick(); } });
  keepAwake();

  render();
  setInterval(tick, 250);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('/cooking/sw.js', { scope: '/cooking/' }).catch(() => {});
}
</script>
</body>
